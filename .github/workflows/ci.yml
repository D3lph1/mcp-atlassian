name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-features

  musl-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build static binary
        run: cargo build --release --locked --target x86_64-unknown-linux-musl -p mcp-atlassian --features http
      - name: Verify static linkage and size
        run: |
          file target/x86_64-unknown-linux-musl/release/mcp-atlassian
          ls -lh target/x86_64-unknown-linux-musl/release/mcp-atlassian
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-atlassian-x86_64-linux-musl
          path: target/x86_64-unknown-linux-musl/release/mcp-atlassian

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t mcp-atlassian:ci .
      - name: Report image size
        run: docker images mcp-atlassian:ci
