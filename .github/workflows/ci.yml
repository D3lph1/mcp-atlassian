name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The binary takes its version from the manifest and the image tags take
  # theirs from the git tag, so a tag pushed without bumping Cargo.toml would
  # publish `:0.2.0` around a binary that answers 0.1.1 — green, and wrong.
  # Runs on every event so that jobs which need it are not skipped along with
  # it; the comparison itself only happens for a tag.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The manifest version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          manifest=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "mcp-atlassian") | .version')
          tag="${GITHUB_REF_NAME#v}"
          echo "manifest: $manifest, tag: $tag"
          if [[ "$manifest" != "$tag" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml $manifest;" \
                 "bump the version in the root manifest and move the tag"
            exit 1
          fi

  # Format, lint and tests on the host toolchain; everything else assumes
  # this is green.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-features

  # Line coverage, gated at 85% (a ratchet: raise it when the number moves
  # up, never lower it) and published to Coveralls for the README badge.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info --fail-under-lines 85
      - uses: coverallsapp/github-action@v2
        with:
          file: lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Advisories and licenses over the whole tree; the policy is deny.toml.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  # Release binaries for every platform a client runs on. Linux is static
  # (musl) so one file works on any distribution and in a scratch image.
  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Cross toolchain (Linux)
        if: runner.os == 'Linux'
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p mcp-atlassian --features http
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="mcp-atlassian-${{ matrix.target }}"
          mkdir -p dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "target/${{ matrix.target }}/release/mcp-atlassian.exe" "dist/$name.exe"
          else
            cp "target/${{ matrix.target }}/release/mcp-atlassian" "dist/$name"
            ls -l "dist/$name"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: mcp-atlassian-${{ matrix.target }}
          path: dist/*

  # The self-contained scratch image (D12) — the `docker build .` the README
  # documents. Built to prove that path still works, never pushed; what
  # ships to GHCR is the `image` job below.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t mcp-atlassian:ci .
      - name: Report image size
        run: docker images mcp-atlassian:ci

  # The published image (D47): linux/amd64 + linux/arm64 assembled from the
  # musl binaries the matrix built natively, so no emulation is involved.
  # Pull requests skip it — the `docker` job already covers the Dockerfile,
  # and a fork's token cannot write packages.
  image:
    if: github.event_name == 'push'
    needs: [build, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: mcp-atlassian-*-linux-musl
          path: dist
          merge-multiple: true
      - name: Name the binaries the way Docker names architectures
        run: |
          set -euo pipefail
          mv dist/mcp-atlassian-x86_64-unknown-linux-musl dist/mcp-atlassian-amd64
          mv dist/mcp-atlassian-aarch64-unknown-linux-musl dist/mcp-atlassian-arm64
          chmod +x dist/mcp-atlassian-amd64 dist/mcp-atlassian-arm64
          ls -l dist
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/d3lph1/mcp-atlassian
          # `latest=auto` puts `latest` on a `v*` tag and nowhere else, so it
          # always means the newest release; master rides under `edge`.
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ci
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # A `v*` tag turns the five binaries into a GitHub release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, coverage, deny, version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  # The Homebrew formula lives in another repository, so this is the one job
  # that cannot use the workflow's own token: HOMEBREW_TAP_TOKEN is a
  # fine-grained PAT scoped to d3lph1/homebrew-tap with contents:write.
  #
  # The formula is generated from the template in .github/homebrew, which
  # makes this repository its single source of truth — the copy in the tap
  # is overwritten on every release. Checksums are computed from the very
  # artifacts the release job attached, not fetched back from the release,
  # so the formula cannot describe a different build than the one published.
  homebrew:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Render the formula
        run: |
          set -euo pipefail
          command -v envsubst >/dev/null || sudo apt-get install -y --no-install-recommends gettext-base
          VERSION="${GITHUB_REF_NAME#v}"
          sha() { sha256sum "dist/$1" | cut -d' ' -f1; }
          export VERSION
          SHA_MACOS_ARM=$(sha mcp-atlassian-aarch64-apple-darwin)
          SHA_MACOS_INTEL=$(sha mcp-atlassian-x86_64-apple-darwin)
          SHA_LINUX_ARM=$(sha mcp-atlassian-aarch64-unknown-linux-musl)
          SHA_LINUX_INTEL=$(sha mcp-atlassian-x86_64-unknown-linux-musl)
          export SHA_MACOS_ARM SHA_MACOS_INTEL SHA_LINUX_ARM SHA_LINUX_INTEL
          # Named substitutions only: the template is Ruby, and a bare
          # envsubst would eat anything else that looks like a variable.
          envsubst '${VERSION} ${SHA_MACOS_ARM} ${SHA_MACOS_INTEL} ${SHA_LINUX_ARM} ${SHA_LINUX_INTEL}' \
            < .github/homebrew/mcp-atlassian.rb > formula.rb
          ruby -c formula.rb
          if grep -q '\${' formula.rb; then
            echo "::error::a placeholder was left unrendered"
            exit 1
          fi
          cat formula.rb
      - uses: actions/checkout@v7
        with:
          repository: d3lph1/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Push the formula
        working-directory: tap
        run: |
          set -euo pipefail
          cp ../formula.rb Formula/mcp-atlassian.rb
          if git diff --quiet; then
            echo "the formula already describes ${GITHUB_REF_NAME}"
            exit 0
          fi
          git config user.name d3lph1
          git config user.email d3lph1.contact@gmail.com
          git commit -am "mcp-atlassian ${GITHUB_REF_NAME#v}"
          git push

  # crates.io, last and on purpose. A GitHub release can be deleted and a
  # container tag can be overwritten; a published version can only be yanked,
  # which hides it from the resolver and leaves the file downloadable for
  # good. So everything reversible happens first, and this runs only if all
  # of it succeeded.
  #
  # `--workspace` orders the five crates itself and waits for each to appear
  # in the index before publishing what depends on it. Re-running a tag fails
  # here — the version already exists — and that is the correct outcome.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
