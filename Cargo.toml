[workspace]
resolver = "2"
members = [
    "crates/mcp-atlassian-client",
    "crates/mcp-atlassian-jira",
    "crates/mcp-atlassian-confluence",
    "crates/mcp-atlassian-storage-markdown",
    "crates/mcp-atlassian",
]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT"
repository = "https://github.com/d3lph1/mcp-atlassian"

[workspace.dependencies]
mcp-atlassian-client = { path = "crates/mcp-atlassian-client", version = "0.1.3" }
mcp-atlassian-jira = { path = "crates/mcp-atlassian-jira", version = "0.1.3" }
mcp-atlassian-confluence = { path = "crates/mcp-atlassian-confluence", version = "0.1.3" }
mcp-atlassian-storage-markdown = { path = "crates/mcp-atlassian-storage-markdown", version = "0.1.3" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "multipart", "stream"] }
# Both already in the tree via reqwest/hyper — streaming attachments (D37).
tokio-util = { version = "0.7", default-features = false, features = ["io"] }
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1", default-features = false }
url = "2"
tracing = "0.1"
# No `env-filter`: `Targets` parses RUST_LOG without pulling in regex.
tracing-subscriber = "0.3"
rmcp = { version = "3", default-features = false, features = ["server", "macros", "transport-io", "elicitation"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
schemars = "1"
# Already in the tree via rmcp with the same features — timestamps only (D23).
chrono = { version = "0.4", default-features = false, features = ["now"] }
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Size-optimized release profile (see DECISIONS.md D12)
[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "z"
