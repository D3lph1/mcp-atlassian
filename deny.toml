# cargo-deny: advisories and licenses, checked in CI (HANDOFF-PLAN §2.5).

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Workspace path dependencies carry no version; that is not the wildcard
# this rule exists for.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
