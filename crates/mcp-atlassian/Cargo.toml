[package]
name = "mcp-atlassian"
description = "Lightweight MCP server for Jira and Confluence"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "mcp-atlassian"
path = "src/main.rs"

[features]
default = []
# Streamable HTTP transport (TRANSPORT=streamable-http); keeps the default
# stdio-only binary small (D7).
http = [
    "rmcp/transport-streamable-http-server",
    "rmcp/transport-streamable-http-server-session",
    "dep:axum",
    "tokio/net",
    "tokio/signal",
]

[dependencies]
axum = { workspace = true, optional = true }
mcp-atlassian-client = { workspace = true, features = ["mcp"] }
mcp-atlassian-jira = { workspace = true, features = ["mcp"] }
mcp-atlassian-confluence = { workspace = true, features = ["mcp"] }
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "io-std", "fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true
rmcp.workspace = true
schemars.workspace = true

[dev-dependencies]
rmcp = { workspace = true, features = ["client"] }
reqwest.workspace = true
wiremock.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "io-util"] }
serde_json.workspace = true

[lints]
workspace = true
