[package]
name = "mcp-atlassian-confluence"
description = "Confluence REST API client (Cloud and Server/Data Center)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# MCP tool definitions on top of the REST client. Off by default so the crate
# stays usable as a plain Atlassian library (D15/D21).
mcp = ["dep:rmcp", "dep:tokio", "dep:mcp-atlassian-storage-markdown", "mcp-atlassian-client/mcp"]

[dependencies]
rmcp = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["fs"] }
mcp-atlassian-storage-markdown = { workspace = true, optional = true }

mcp-atlassian-client.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
wiremock.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
